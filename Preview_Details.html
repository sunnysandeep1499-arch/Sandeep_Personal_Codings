<script>
  async function submitDetails() {
    const storedDetails = localStorage.getItem("details");

    if (!storedDetails) {
      showError("⚠️ No details found to submit.");
      return;
    }

    const details = JSON.parse(storedDetails);

    try {
      const response = await fetch("http://localhost:3000/saveDetails", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(details)
      });

      const result = await response.json();

      if (result.status === "success") {
        localStorage.removeItem("details");
        showSuccess(
          "✅ Details submitted successfully!",
          "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif"
        );
      } else {
        showError("❌ Submission failed. Please try again.");
      }
    } catch (err) {
      console.error(err);
      showError("⚠️ Unable to connect to server.");
    }
  }

  function showSuccess(message, gifUrl) {
    document.body.innerHTML = `
      <div class="status">
        <div class="status-message success-message">${message}</div>
        <img src="${gifUrl}" alt="Success">
      </div>
    `;
  }

  function showError(message) {
    document.body.innerHTML = `
      <div class="status">
        <div class="status-message" style="color:red;">${message}</div>
      </div>
    `;
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview Details</title>
  <link rel="stylesheet" href="Update_Details.css">
  <style>
    .success-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #e0f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Times New Roman', Times, serif;
      color: #00796b;
      font-size: 24px;
      text-align: center;
      z-index: 1000;
    }
    .success-screen span {
      font-size: 50px;
      display: block;
      margin-bottom: 20px;
    }
    #preview p {
      margin: 8px 0;
    }
    #csvLink {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 15px;
      background: #00796b;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
    }
    #csvLink:hover {
      background: #004d40;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Preview Your Details</h1>
    <div id="preview"></div>

    <button onclick="editDetails()">Edit</button>
    <button onclick="prepareCSV()">Submit</button>

    <!-- Container for CSV preview -->
    <div id="csvContainer" style="margin-top:20px; display:none;">
      <h2>Review CSV</h2>
      <pre id="csvPreview" style="background:#f0f0f0;padding:10px;border-radius:5px;"></pre>
      <a id="csvLink" href="#" download="">Download CSV</a>
    </div>
  </div>

  <script>
    const previewDiv = document.getElementById("preview");
    const details = JSON.parse(localStorage.getItem("details"));

    if (!details) {
      previewDiv.innerHTML = "<p>No data found</p>";
    } else {
      const workInfo = details.studiesJobType === "Studies"
        ? details.studiesDetail
        : details.jobDetail;

      previewDiv.innerHTML = `
        <p><b>Name:</b> ${details.title} ${details.name}</p>
        <p><b>Phone:</b> ${details.phone}</p>
        <p><b>Location:</b> ${details.location}</p>
        <p><b>Attended From:</b> ${details.attendedFrom}</p>
        <p><b>${details.studiesJobType}:</b> ${workInfo}</p>
        <p><b>Praise / Prayer Points:</b> ${details.points}</p>
      `;
    }

    function editDetails() {
      window.location.assign("Update_Details.html");
    }

    function prepareCSV() {
      if (!details) return;

      // Build CSV string
      const csvHeader = "Title,Name,Phone,Location,Studies/Job,Details,Praise/Prayer,Attended From\n";
      const workInfo = details.studiesJobType === "Studies" ? details.studiesDetail : details.jobDetail;
      const csvRow = `"${details.title}","${details.name}","${details.phone}","${details.location}","${details.studiesJobType}","${workInfo}","${details.points}","${details.attendedFrom}"\n`;
      const csvContent = csvHeader + csvRow;

      // Show CSV in <pre>
      document.getElementById("csvPreview").textContent = csvContent;

      // Enable CSV download
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const csvLink = document.getElementById("csvLink");
      csvLink.href = url;
      csvLink.download = `Submitted_Details_${Date.now()}.csv`;

      // Show the CSV container
      document.getElementById("csvContainer").style.display = "block";

      // Clear localStorage
      localStorage.removeItem("details");
    }
  </script>
</body>
</html>

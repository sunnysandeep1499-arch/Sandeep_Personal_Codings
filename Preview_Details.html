<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview Details</title>
  <link rel="stylesheet" href="Update_Details.css">
  <style>
    .success-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #e0f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Times New Roman', Times, serif;
      color: #00796b;
      font-size: 24px;
      text-align: center;
      z-index: 1000;
    }
    .success-screen span {
      font-size: 50px;
      display: block;
      margin-bottom: 20px;
    }
    #preview p { margin: 8px 0; }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }
    button {
      margin: 10px 5px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Preview Your Details</h1>
    <div id="preview"></div>

    <button onclick="editDetails()">Edit</button>
    <button onclick="submitToExcel()">Submit</button>
  </div>

  <script>
    const previewDiv = document.getElementById("preview");
    const detailsJSON = localStorage.getItem("details");
    const details = detailsJSON ? JSON.parse(detailsJSON) : null;

    if (!details) {
      previewDiv.innerHTML = "<p>No data found</p>";
    } else {
      const workInfo = details.studiesJobType === "Studies"
        ? details.studiesDetail
        : details.jobDetail;

      // Attended From moved to the end
      previewDiv.innerHTML = `
        <p><b>Name:</b> ${details.title || ""} ${details.name || ""}</p>
        <p><b>Phone:</b> ${details.phone || ""}</p>
        <p><b>Location:</b> ${details.location || ""}</p>
        <p><b>${details.studiesJobType || ""}:</b> ${workInfo || ""}</p>
        <p><b>Praise / Prayer Points:</b> ${details.points || ""}</p>
        <p><b>Attended From:</b> ${details.attendedFrom || ""}</p>
      `;
    }

    function editDetails() {
      window.location.assign("Update_Details.html");
    }

    function submitToExcel() {
      if (!details) return;

      fetch("http://localhost:3000/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(details)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          localStorage.removeItem("details");
          const successDiv = document.createElement("div");
          successDiv.className = "success-screen";
          successDiv.innerHTML = `<span>✅</span>Successfully Updated Your Details in Youth_Details.xlsx!`;
          document.body.innerHTML = "";
          document.body.appendChild(successDiv);
        } else {
          alert("❌ Error saving data: " + data.message);
        }
      })
      .catch(() => {
        alert("❌ Network error. Data not saved");
      });
    }
  </script>
</body>
</html>

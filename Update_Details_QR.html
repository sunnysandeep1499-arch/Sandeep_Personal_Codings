<!DOCTYPE html>
<html>
<head>
  <title>Scan for Updating Prayer Points</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;   /* center horizontally */
      justify-content: center; /* center vertically */
      height: 100vh;         /* full screen height */
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .qr-wrapper {
      position: relative;
      display: inline-block;
    }
    #qrcode {
      width: 200px;
      height: 200px;
    }
    .overlay-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;   /* adjust size of logo */
      height: 50px;
      border-radius: 8px; /* optional: rounded corners */
    }
  </style>
</head>
  
<body>
  <h2>Scan for Updating Prayer Points</h2>
  <div class="qr-wrapper">
    <div id="qrcode"></div>
    <!-- Overlay logo image -->
    <img src="stwh weba logo.jpg" alt="Logo" class="overlay-logo">
  </div>

  <script>
    // Replace with your GitHub Pages URL
    var githubURL = "https://sunnysandeep1499-arch.github.io/Sandeep_Personal_Codings/Main_Page.html";
    
    // Generate QR code inside the div
    new QRCode(document.getElementById("qrcode"), {
      text: githubURL,
      width: 200,
      height: 200
    });
  </script>
</body>
</html>

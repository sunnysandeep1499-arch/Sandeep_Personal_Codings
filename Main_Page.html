<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Main_Page.css">
    <title>STWH Youth Details</title>
</head>

<body>
    <h1 class="head1">Shalem Telugu Worship Home</h1>
    <h2 class="head2">Youth Meeting</h2>
    <h3 class="head3">Date: <span id="currentDate"></span></h3>

    <div class="content">
        <!-- Logo -->
        <img
            src="stwh_weba_logo.jpg"
            alt="STWH Logo"
            id="logo-button"
        >

        <!-- Buttons -->
        <div class="button-container">
            <button onclick="window.location.href='View_Details.html'">
                View Details
            </button>
            <button onclick="window.location.href='Update_Details.html'">
                Update Details
            </button>
        </div>
    </div>

    <script>
        const today = new Date();
        const formattedDate =
            today.getDate() + "/" +
            (today.getMonth() + 1) + "/" +
            today.getFullYear();

        document.getElementById("currentDate").textContent = formattedDate;
    </script>
</body>
</html>

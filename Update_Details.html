<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Details</title>
  <link rel="stylesheet" href="Update_Details.css">
  <style>
    .required::after { content: " *"; color: red; }
    .hidden { display: none; }
    .note {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Update Your Details</h1>

    <label class="required">Name:</label>
    <div class="name-field">
      <select id="title">
        <option value="">-Select-</option>
        <option value="Br.">Br.</option>
        <option value="Sis.">Sis.</option>
      </select>
      <input type="text" id="name">
    </div>

    <label class="required">Phone:</label>
    <input type="tel" id="phone">

    <label class="required">Location:</label>
    <input type="text" id="location">

    <label class="required">Studies / Job:</label>
    <select id="studiesJobType">
      <option value="">-Select-</option>
      <option value="Studies">Studies</option>
      <option value="Job">Job</option>
    </select>

    <div id="studiesInput" class="hidden">
      <input type="text" id="studiesDetail" placeholder="What are you studying?">
    </div>

    <div id="jobInput" class="hidden">
      <input type="text" id="jobDetail" placeholder="Where are you working?">
    </div>

    <label class="required">Praise / Prayer Points:</label>
    <textarea id="points" placeholder="Enter Praise/Prayer Points"></textarea>
    <small class="note">Note: Praise/Prayer Points is mandatory</small>

    <label class="required">Attended From:</label>
    <select id="attendedFrom">
      <option value="">-Select-</option>
      <option value="STWH">STWH</option>
      <option value="WEBA">WEBA</option>
    </select>

    <button id="previewBtn">Preview</button>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const nameEl = document.getElementById("name");
    const phoneEl = document.getElementById("phone");
    const locationEl = document.getElementById("location");
    const studiesJobTypeEl = document.getElementById("studiesJobType");
    const studiesDetailEl = document.getElementById("studiesDetail");
    const jobDetailEl = document.getElementById("jobDetail");
    const pointsEl = document.getElementById("points");
    const attendedFromEl = document.getElementById("attendedFrom");

    const studiesInput = document.getElementById("studiesInput");
    const jobInput = document.getElementById("jobInput");

    studiesJobTypeEl.addEventListener("change", toggleStudiesJobInput);

    function toggleStudiesJobInput() {
      studiesInput.classList.add("hidden");
      jobInput.classList.add("hidden");

      if (studiesJobTypeEl.value === "Studies") studiesInput.classList.remove("hidden");
      if (studiesJobTypeEl.value === "Job") jobInput.classList.remove("hidden");
    }

    // Prefill data on edit
    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem("details"));
      if (!saved) return;

      titleEl.value = saved.title;
      nameEl.value = saved.name;
      phoneEl.value = saved.phone;
      locationEl.value = saved.location;
      studiesJobTypeEl.value = saved.studiesJobType;
      toggleStudiesJobInput();
      studiesDetailEl.value = saved.studiesDetail || "";
      jobDetailEl.value = saved.jobDetail || "";
      pointsEl.value = saved.points || "";
      attendedFromEl.value = saved.attendedFrom;
    };

    // Preview button click
    document.getElementById("previewBtn").addEventListener("click", () => {
      const details = {
        title: titleEl.value.trim(),
        name: nameEl.value.trim(),
        phone: phoneEl.value.trim(),
        location: locationEl.value.trim(),
        studiesJobType: studiesJobTypeEl.value,
        studiesDetail: studiesDetailEl.value.trim(),
        jobDetail: jobDetailEl.value.trim(),
        points: pointsEl.value.trim(),   // ✅ Mandatory
        attendedFrom: attendedFromEl.value
      };

      // Mandatory validation
      if (
        !details.title ||
        !details.name ||
        !details.phone ||
        !details.location ||
        !details.studiesJobType ||
        !details.points ||             // ✅ Mandatory check
        !details.attendedFrom
      ) {
        alert("⚠️ Please fill all mandatory fields including Praise/Prayer Points");
        return;
      }

      if (details.studiesJobType === "Studies" && !details.studiesDetail) {
        alert("⚠️ Please enter studies details");
        return;
      }

      if (details.studiesJobType === "Job" && !details.jobDetail) {
        alert("⚠️ Please enter job details");
        return;
      }

      localStorage.setItem("details", JSON.stringify(details));

      // Redirect to Preview
      window.location.assign("Preview_Details.html");
    });
  </script>
</body>
</html>

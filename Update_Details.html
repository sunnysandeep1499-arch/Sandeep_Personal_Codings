<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Details</title>
  <link rel="stylesheet" href="Update_Details.css">
  <style>
    .required::after {
      content: " *";
      color: red;
    }
    .note {
      font-size: 12px;
      color: #555;
      margin-bottom: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Update Your Details</h1>

    <label class="required">Name:</label>
    <div class="name-field">
      <select id="title">
        <option value="">-Select-</option>
        <option value="Br.">Br.</option>
        <option value="Sis.">Sis.</option>
      </select>
      <input type="text" id="name" placeholder="Enter Name">
    </div>

    <label class="required">Phone:</label>
    <input type="tel" id="phone">

    <label class="required">Location:</label>
    <input type="text" id="location">

    <!-- ✅ NEW FIELD -->
    <label class="required">Attended From:</label>
    <select id="attendedFrom">
      <option value="">-Select-</option>
      <option value="STWH">STWH</option>
      <option value="WEBA">WEBA</option>
    </select>

    <label class="required">Studies / Job:</label>
    <select id="studiesJobType" onchange="toggleStudiesJobInput()">
      <option value="">-Select-</option>
      <option value="Studies">Studies</option>
      <option value="Job">Job</option>
    </select>

    <div id="studiesInput" class="hidden">
      <input type="text" id="studiesDetail" placeholder="What are you studying?">
    </div>

    <div id="jobInput" class="hidden">
      <input type="text" id="jobDetail" placeholder="Where are you working?">
    </div>

    <label class="required">Praise / Prayer Points:</label>
    <textarea id="points"></textarea>
    <div class="note">If nothing to share, type <b>No Points</b>.</div>

    <button onclick="goToPreview()">Preview</button>
  </div>

  <script>
    function toggleStudiesJobInput() {
      const type = document.getElementById("studiesJobType").value;
      document.getElementById("studiesInput").classList.add("hidden");
      document.getElementById("jobInput").classList.add("hidden");

      if (type === "Studies") {
        document.getElementById("studiesInput").classList.remove("hidden");
      }
      if (type === "Job") {
        document.getElementById("jobInput").classList.remove("hidden");
      }
    }

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem("details"));
      if (saved) {
        document.getElementById("title").value = saved.title || "";
        document.getElementById("name").value = saved.name || "";
        document.getElementById("phone").value = saved.phone || "";
        document.getElementById("location").value = saved.location || "";
        document.getElementById("attendedFrom").value = saved.attendedFrom || "";
        document.getElementById("studiesJobType").value = saved.studiesJobType || "";
        toggleStudiesJobInput();
        document.getElementById("studiesDetail").value = saved.studiesDetail || "";
        document.getElementById("jobDetail").value = saved.jobDetail || "";
        document.getElementById("points").value = saved.points || "";
      }
    };

    function goToPreview() {
      const details = {
        title: title.value,
        name: name.value,
        phone: phone.value,
        location: location.value,
        attendedFrom: attendedFrom.value,
        studiesJobType: studiesJobType.value,
        studiesDetail: studiesDetail.value,
        jobDetail: jobDetail.value,
        points: points.value
      };

      if (
        !details.title || !details.name || !details.phone ||
        !details.location || !details.attendedFrom ||
        !details.studiesJobType || !details.points
      ) {
        alert("⚠️ Please fill all required fields");
        return;
      }

      if (details.studiesJobType === "Studies" && !details.studiesDetail) {
        alert("⚠️ Enter studies details");
        return;
      }

      if (details.studiesJobType === "Job" && !details.jobDetail) {
        alert("⚠️ Enter job details");
        return;
      }

      localStorage.setItem("details", JSON.stringify(details));
      window.location.href = "Preview_Details.html";
    }
  </script>
</body>
</html>
